name: DirectSale payment modal refactor

on:
  push:
    branches:
      - refactor/data-layer

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Extract PaymentModal
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/DirectSale/DirectSale.jsx')
          text = path.read_text(encoding='utf-8')

          if "./components/PaymentModal" in text:
              print('PaymentModal already extracted.')
              raise SystemExit(0)

          start_marker = '      {/* ÖDEME YÖNTEMİ MODALI */}'
          end_marker = '\n      {/* CARİ SEÇ MODALI */}'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          block = block.split('\n', 1)[1]

          component = '''import {
            Banknote,
            CreditCard,
            UtensilsCrossed,
            BookOpen,
            Calculator,
            ChevronUp,
            ChevronDown,
            Delete,
            Undo2,
            X,
          } from 'lucide-react';

          export default function PaymentModal({
            payMode,
            setPayMode,
            selectedItems,
            selectedTotal,
            finalTotal,
            showChangeCalc,
            setShowChangeCalc,
            receivedAmount,
            setReceivedAmount,
            handlePay,
            openCariPicker,
            TL,
          }) {
            return (
          ''' + block + '''
            );
          }
          '''

          out = Path('src/pages/DirectSale/components/PaymentModal.jsx')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(component, encoding='utf-8')

          replacement = '''      <PaymentModal
            payMode={payMode}
            setPayMode={setPayMode}
            selectedItems={selectedItems}
            selectedTotal={selectedTotal}
            finalTotal={finalTotal}
            showChangeCalc={showChangeCalc}
            setShowChangeCalc={setShowChangeCalc}
            receivedAmount={receivedAmount}
            setReceivedAmount={setReceivedAmount}
            handlePay={handlePay}
            openCariPicker={openCariPicker}
            TL={TL}
          />'''
          text = text[:start] + replacement + text[end:]

          anchor = "import GenericModal from './components/GenericModal';\n"
          text = text.replace(anchor, anchor + "import PaymentModal from './components/PaymentModal';\n", 1)
          path.write_text(text, encoding='utf-8')
          print('PaymentModal extracted.')
          PY

      - name: Build
        run: npm run build

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/refactor-directsale-payment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DirectSale/DirectSale.jsx src/pages/DirectSale/components/PaymentModal.jsx .github/workflows/refactor-directsale-payment.yml
          git commit -m "refactor: extract DirectSale payment modal"
          git push
